name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Vercel
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error title=Missing Secrets::VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID são necessários."
            echo "::error::Configure em: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          
          # Capture deploy output and extract URL
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee /dev/stderr)
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+' | tail -1)
          
          if [ -n "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
            echo "✅ Deploy concluído: $DEPLOY_URL"
          else
            echo "::warning::Não foi possível extrair a URL do deploy, mas o deploy pode ter sido bem-sucedido."
          fi

      - name: Deploy success notification
        if: ${{ steps.vercel-deploy.outputs.DEPLOY_URL != '' }}
        run: |
          echo "::notice title=Deploy Success::✅ Deploy concluído com sucesso!"
          echo "::notice title=Deploy URL::🌐 ${{ steps.vercel-deploy.outputs.DEPLOY_URL }}"

      - name: Comment PR with deploy URL
        if: ${{ github.event_name == 'pull_request' && steps.vercel-deploy.outputs.DEPLOY_URL != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Deploy Preview Ready!\n\n🌐 **URL:** ${{ steps.vercel-deploy.outputs.DEPLOY_URL }}\n\n_Automated deployment by Vercel_`
            })

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "::error title=Deploy Failed::❌ O deploy falhou. Verifique os logs acima."
          echo "🔍 Dica: Execute 'npm run build' localmente para reproduzir o erro"
