<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-labelledby="title desc" role="img">
  <title>PULSEOPS Logo (Full Color)</title>
  <desc>Cloud + pixels, simplified neon/tech gradient</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>
  <!-- Cloud shape -->
  <path fill="url(#grad)" filter="url(#soft)"
        d="M78 50c0-10.5-8.5-19-19-19-7.8 0-14.6 4.7-17.3 11.5-1.6-.5-3.3-.8-5-.8-9.9 0-18 8.1-18 18s8.1 18 18 18h53c8.8 0 16-7.2 16-16s-7.2-16-16-16c-3 0-5.8.8-8.2 2.2-1.3-5.1-6-8.9-11.5-8.9z"/>
  <!-- Pixels rising (data/tech cue) -->
  <rect x="90" y="22" width="10" height="10" rx="2" fill="url(#grad)"/>
  <rect x="104" y="16" width="12" height="12" rx="2" fill="url(#grad)"/>
  <rect x="118" y="28" width="8" height="8" rx="2" fill="url(#grad)"/>
</svg>